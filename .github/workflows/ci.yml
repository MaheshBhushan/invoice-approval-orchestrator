name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install dependencies
        run: python -m pip install -r services/requirements.txt
      - name: Python syntax and unit tests
        run: PYTHONPATH=services python -m compileall -q services tests scripts && PYTHONPATH=services pytest -q tests/test_classifier.py tests/test_recovery.py tests/test_ocr.py
      - name: Validate BPMN XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('bpmn/invoice-approval.bpmn')"
      - name: Validate Compose configuration
        run: |
          docker compose config -q
          docker compose --project-name invoice-recovery -f compose.yaml -f compose.recovery.yaml config -q
      - name: Build application image
        run: docker build -f services/Dockerfile .

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: invoice-approval
      - name: Build and load application image
        run: |
          docker build -t invoice-approval-orchestrator:ci -f services/Dockerfile .
          kind load docker-image invoice-approval-orchestrator:ci --name invoice-approval
      - name: Install Helm chart
        run: helm install invoice-approval deploy/helm/invoice-approval-orchestrator --set image.tag=ci
