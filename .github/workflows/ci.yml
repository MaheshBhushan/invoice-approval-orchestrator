name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r services/requirements.txt
      - name: Python syntax and unit tests
        run: PYTHONPATH=services python -m compileall -q services tests && PYTHONPATH=services pytest -q tests/test_classifier.py
      - name: Validate BPMN XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('bpmn/invoice-approval.bpmn')"
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build application image
        run: docker build -f services/Dockerfile .
