apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camunda-primary-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.camunda.primaryStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camunda-secondary-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.camunda.secondaryStorage }}
