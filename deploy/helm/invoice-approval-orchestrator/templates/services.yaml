{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-api
  template:
    metadata:
      labels:
        app: invoice-api
    spec:
      containers:
        - name: invoice-api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [uvicorn, api.main:app, --host, 0.0.0.0, --port, "8000"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: CAMUNDA_REST_URL
              value: http://orchestration:8080/v2
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-api
spec:
  selector:
    app: invoice-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-service
  template:
    metadata:
      labels:
        app: finance-service
    spec:
      containers:
        - name: finance-service
          image: {{ printf "%s:%s" .Values.financeService.repository .Values.financeService.tag }}
          imagePullPolicy: {{ .Values.financeService.pullPolicy }}
          env:
            - name: JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: JDBC_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
spec:
  selector:
    app: finance-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-workers
  template:
    metadata:
      labels:
        app: invoice-workers
    spec:
      containers:
        - name: invoice-workers
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, workers.main]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: ZEEBE_HOST
              value: orchestration
            - name: ZEEBE_PORT
              value: "26500"
            - name: FINANCE_URL
              value: http://finance-service:8001
