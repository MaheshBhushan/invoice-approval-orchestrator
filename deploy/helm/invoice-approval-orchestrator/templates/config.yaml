apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.postgres.user .Values.postgres.password .Values.postgres.database | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  001_schema.sql: |
{{ .Files.Get "files/db/001_schema.sql" | indent 4 }}
  002_seed.sql: |
{{ .Files.Get "files/db/002_seed.sql" | indent 4 }}
  003_data_quality.sql: |
{{ .Files.Get "files/db/003_data_quality.sql" | indent 4 }}
  004_reconciliation.sql: |
{{ .Files.Get "files/db/004_reconciliation.sql" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: camunda-config
data:
  application.yaml: |
{{ .Files.Get "files/camunda/application.yaml" | indent 4 }}
